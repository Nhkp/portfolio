name: side-project

services:
  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    container_name: side-project-backend
    ports:
      - "8000:8000"
    environment:
      - ENV=production
    volumes:
      - .:/app
    command: uv run uvicorn backend.main:app --host 0.0.0.0 --port 8000 --reload
